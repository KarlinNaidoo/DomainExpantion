services:
  postgres:
    image: postgres:16-alpine
    container_name: domain-expantion-postgres
    environment:
      POSTGRES_USER: domain
      POSTGRES_PASSWORD: domain
      POSTGRES_DB: domain_expantion
    ports:
      - "5433:5432"
    volumes:
      - domain_expantion_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domain -d domain_expantion"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  domain_expantion_pg:
