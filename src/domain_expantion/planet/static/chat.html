<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Domain Expantion chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0e1410; color: #e8f0e4; font-family: "Segoe UI", system-ui, sans-serif; }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    header { padding: 10px 12px; border-bottom: 1px solid #2a3a2e; font-size: 12px; color: #9cbb8a; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    header .title { letter-spacing: .12em; text-transform: uppercase; }
    select { background: #1a221c; border: 1px solid #3a4d3e; color: inherit; padding: 4px 6px; border-radius: 6px; max-width: 160px; }
    #log { flex: 1; overflow: auto; padding: 12px; font-size: 14px; line-height: 1.45; }
    .you { color: #c9e4ff; margin: 10px 0 4px; }
    .sup { color: #e8f0e4; margin: 4px 0 10px; white-space: pre-wrap; }
    .tool { color: #fbbf24; font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: pre-wrap; }
    .err { color: #fca5a5; }
    form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #2a3a2e; }
    input { flex: 1; background: #1a221c; border: 1px solid #3a4d3e; color: inherit; padding: 8px 10px; border-radius: 8px; }
    button { background: #3f7a4a; border: 0; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <span class="title" id="hdr">Supervisor</span>
      <select id="chats" title="Resume a conversation"><option value="">Recent chats</option></select>
    </header>
    <div id="log"></div>
    <form id="f">
      <input id="msg" autocomplete="off" placeholder="Message the supervisor…" />
      <button type="submit">Send</button>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const agent = params.get("agent") || "supervisor";
    const thread = params.get("thread") || ("colony-" + (agent === "supervisor" ? "main" : agent));
    document.getElementById("hdr").textContent = "Supervisor · " + thread + (agent !== "supervisor" ? " · focus " + agent : "");
    const log = document.getElementById("log");
    const input = document.getElementById("msg");
    const form = document.getElementById("f");
    if (agent !== "supervisor") {
      input.placeholder = "Ask the supervisor (can delegate to " + agent + ")…";
    }
    function renderEvent(ev) {
      if (ev.kind === "user") add("you", "You: " + ev.text);
      else if (ev.kind === "tool_call") {
        const args = Object.entries(ev.args || {}).map(([k,v]) => k + ": " + v).join(" | ");
        add("tool", "→ " + ev.name + (args ? "  " + args : ""));
      } else if (ev.kind === "tool_result") add("tool", "← " + ev.name + "\n" + (ev.text || ""));
      else if (ev.kind === "error") add("err", ev.text);
      else add("sup", "Supervisor: " + ev.text);
    }
    function add(cls, text) {
      const el = document.createElement("div");
      el.className = cls;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      add("you", "You: " + message);
      form.querySelector("button").disabled = true;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ thread_id: thread, message }),
        });
        if (!res.ok) throw new Error(await res.text());
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop() || "";
          for (const line of lines) {
            if (!line.trim()) continue;
            renderEvent(JSON.parse(line));
          }
        }
      } catch (err) {
        add("err", String(err));
      }
      form.querySelector("button").disabled = false;
      input.focus();
    });
    (async () => {
      try {
        const hist = await fetch("/api/history?thread_id=" + encodeURIComponent(thread)).then((r) => r.json());
        (hist.events || []).forEach(renderEvent);
        if (!(hist.events || []).length) add("tool", "This thread is empty so far.");
      } catch (err) {
        add("err", "Could not load history: " + err);
      }
      try {
        const data = await fetch("/api/chats").then((r) => r.json());
        const sel = document.getElementById("chats");
        for (const chat of data.chats || []) {
          const opt = document.createElement("option");
          opt.value = chat.thread_id;
          opt.textContent = (chat.preview || chat.thread_id).slice(0, 40);
          if (chat.thread_id === thread) opt.selected = true;
          sel.appendChild(opt);
        }
        sel.onchange = () => {
          const id = sel.value;
          if (!id || id === thread) return;
          location.search = "?thread=" + encodeURIComponent(id) + "&agent=" + encodeURIComponent(agent);
        };
      } catch {
        /* no catalog yet */
      }
    })();
  </script>
</body>
</html>
